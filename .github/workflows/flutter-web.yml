name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (Main)
        if: github.ref == 'refs/heads/main'
        run: flutter build web --base-href /SPG_Attendant/

      - name: Deploy Main to GitHub Pages (Root)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          keep_files: true

      - name: Build Web (Beta)
        if: github.ref == 'refs/heads/beta'
        run: flutter build web --base-href /SPG_Attendant/beta/

      - name: Deploy Beta to GitHub Pages (/beta subfolder)
        if: github.ref == 'refs/heads/beta'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          destination_dir: beta
